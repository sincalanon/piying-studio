<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <style>
      .puppet { fill: #1a1a1a; }
      .text-cn { font-family: "Songti SC", "SimSun", serif; font-weight: bold; fill: #1a1a1a; }
      .text-en { font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 500; fill: #333; letter-spacing: 2px; }
      .accent { fill: #C8102E; opacity: 0.12; }
    </style>
  </defs>
  
  <!-- Soft background glow -->
  <ellipse cx="90" cy="100" rx="60" ry="75" class="accent"/>
  
  <!-- Simplified puppet silhouette -->
  <g class="puppet" transform="translate(20, 20) scale(0.8)">
    <!-- Head -->
    <path d="M95 30 
             C85 25, 75 30, 70 40
             C65 50, 68 60, 75 65
             L80 70
             C78 80, 80 90, 85 95
             L90 100
             C95 105, 105 105, 110 100
             L115 95
             C120 90, 122 80, 120 70
             L125 65
             C132 60, 135 50, 130 40
             C125 30, 115 25, 105 30
             Z"/>
    <!-- Body -->
    <path d="M90 100 
             C85 110, 80 130, 85 150
             L90 170
             C95 180, 105 180, 110 170
             L115 150
             C120 130, 115 110, 110 100
             Z"/>
    <!-- Arm -->
    <path d="M85 120 
             C70 115, 55 120, 50 130
             C48 135, 52 140, 58 138
             C70 130, 80 125, 90 125
             Z"/>
    <circle cx="95" cy="50" r="3" fill="white"/>
    <circle cx="105" cy="55" r="2.5" fill="white"/>
  </g>
  
  <!-- Text -->
  <text x="180" y="95" class="text-cn" font-size="42">皮影</text>
  <text x="180" y="130" class="text-en" font-size="16">PIYING STUDIO</text>
</svg>
